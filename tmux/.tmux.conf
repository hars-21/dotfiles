##### PREFIX #####
unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### PERFORMANCE #####
set -sg escape-time 0
set -g history-limit 20000

##### TERMINAL #####
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

##### MOUSE #####
set -g mouse on

##### INDEXING #####
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

##### SPLITS (VIM-LIKE) #####
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

##### PANE NAVIGATION (VIM STYLE) #####
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### RESIZE PANES #####
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### COPY MODE (NEOVIM FRIENDLY) #####
setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

##### STATUS BAR #####
set -g status-interval 3
set -g status-position bottom

set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g message-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left-length 40
set -g status-left "#[fg=#a6e3a1] #(cd #{pane_current_path} 2>/dev/null && git branch --show-current 2>/dev/null) #[fg=#89b4fa]#S "

set -g status-right-length 60
set -g status-right "#[fg=#fab387]%Y-%m-%d #[fg=#f9e2af]%H:%M #[fg=#94e2d5]#(whoami)"

##### WINDOW STATUS #####
setw -g window-status-style "fg=#6c7086"
setw -g window-status-current-style "fg=#cdd6f4,bold"

##### ACTIVITY #####
setw -g monitor-activity on
set -g visual-activity on

##### QUALITY OF LIFE #####
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded ✔"

